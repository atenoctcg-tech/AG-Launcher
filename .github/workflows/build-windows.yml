name: Build AG Launcher Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'manifests/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate website JavaScript
        shell: pwsh
        run: |
          node --check .\docs\app.js
          node --check .\docs\admin.js

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\Build-Windows.ps1

      - name: Smoke-test updater
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP ("AGLauncherUpdaterSmoke-" + [guid]::NewGuid().ToString("N"))
          $payload = Join-Path $root "payload"
          $target = Join-Path $root "target"
          $zip = Join-Path $root "update.zip"
          New-Item -ItemType Directory -Force -Path $payload, $target | Out-Null
          Set-Content -Path (Join-Path $payload "updater-smoke.txt") -Value "AG Launcher updater OK"
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $zip -Force
          $updater = Resolve-Path ".\dist\updater\AGLauncher.Updater.exe"
          $restart = "$env:WINDIR\System32\where.exe"
          $p = Start-Process -FilePath $updater -ArgumentList @(
            "--pid","2147483647",
            "--package",$zip,
            "--target",$target,
            "--restart",$restart
          ) -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Updater smoke test timed out." }
          if (-not (Test-Path (Join-Path $target "updater-smoke.txt"))) { throw "Updater smoke test failed: marker file missing." }
          Write-Host "Updater smoke test passed."


      - name: Publish versioned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content ".\src\AGLauncher\AGLauncher.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Launcher version not found in AGLauncher.csproj" }
          $tag = "v$version"
          $zip = ".\dist\AGLauncher-win-x64.zip"
          $assetName = "AG Launcher.zip"
          Copy-Item $zip $assetName -Force
          $sourceName = "AG Launcher Source.zip"
          git archive --format=zip --output=$sourceName HEAD

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing Windows asset."
            gh release upload $tag $assetName $sourceName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $assetName $sourceName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AG Launcher $tag" --notes "AG Launcher $tag Windows x64. Animated GIF/MP4 banners, separate Library art, improved install UI and automatic updates."
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AGLauncher-win-x64
          path: dist/AGLauncher-win-x64/**
          if-no-files-found: error

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AGLauncher-source
          path: |
            AGLauncher.sln
            README.md
            launcher-manifest.json
            manifests/**
            scripts/**
            src/**
            docs/**
          if-no-files-found: error
